[package]
name = "fenec-import"
description = "Import for fenecdb: SQLite files and PostgreSQL servers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# No external dependencies. The SQLite file format is read by hand; the
# PostgreSQL wire protocol is spoken through fenec-pg's client.
fenec-core = { workspace = true, features = ["std-fs"] }
fenec-pg.workspace = true

[dev-dependencies]
# For building `--where` expressions with the real parser in tests.
fenec-ql = { path = "../fenec-ql" }

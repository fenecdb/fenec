[package]
name = "fenec-import"
description = "Import for fenecdb: SQLite files and PostgreSQL servers"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# No external dependencies. The SQLite file format is read by hand; the
# PostgreSQL wire protocol is spoken through fenec-wire's client.
fenec-core = { workspace = true, features = ["std-fs", "indexes"] }
fenec-wire.workspace = true
# `--where` and `--index` are read by FenecQL's own parser (`args`).
fenec-ql.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

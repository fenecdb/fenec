[package]
name = "fenec-http"
description = "HTTP/JSON endpoint for fenecdb: a REST surface derived from the schema"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fenec-core = { workspace = true, features = ["std-fs", "indexes"] }
fenec-ql.workspace = true
fenec-abi.workspace = true

[features]
# `timing`: where a request's time goes, phase by phase, at `GET /_timing`
# (`src/timing.rs`); off, none of it is compiled.
timing = []

[[test]]
name = "all"
path = "tests/all.rs"

# Apart: reads the process's own counts.
[[test]]
name = "tenants"
path = "tests/tenants.rs"

# Apart: the audit log and the count of failures are the process's own.
[[test]]
name = "audit"
path = "tests/audit.rs"

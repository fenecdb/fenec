[package]
name = "fenec-ql"
description = "FenecQL: fenecdb's minimal query language"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fenec-core = { workspace = true, default-features = false }

# The tests run their statements through the engine, every index among
# them. The parser needs none, and asking for them here would put them back
# into a browser module made without them.
[dev-dependencies]
fenec-core = { workspace = true, features = ["full"] }

[features]
default = ["statements"]
# Named statements -- `create statement`, `drop statement`, `statements`,
# `describe statement`, `call` and SQL's `CALL` -- read into their trees
# (fenec-core's `statements`). Without it each is refused in words of its
# own, a `$name` too, and the rest of the language reads as ever: the
# browser module, which the workspace's dependency leaves it out of. Not in
# fenec-core's `full`, so naming `full` does not bring it into the module.
statements = ["fenec-core/statements"]

[[test]]
name = "all"
path = "tests/all.rs"

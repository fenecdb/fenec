[package]
name = "fenec-cli"
description = "fenecdb command line shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fenec-core.workspace = true
fenec-ql.workspace = true
# The `fenec import` subcommand. The SQLite reader + PostgreSQL client grow the
# binary by ~190 KB; it is unnecessary for embedded/browser use and can be
# turned off: `cargo build --release -p fenec-cli --no-default-features`.
fenec-import = { workspace = true, optional = true }

[features]
default = ["import"]
import = ["dep:fenec-import"]

[[bin]]
name = "fenec"
path = "src/main.rs"

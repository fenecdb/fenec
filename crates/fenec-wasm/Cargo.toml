[package]
name = "fenec-wasm"
description = "fenecdb's browser (WASM) binding -- raw ABI, no wasm-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fenec-core = { workspace = true, default-features = false }
fenec-ql.workspace = true
# Without the replica's sync, the native bindings': dead code in the
# module all the same, its mere presence moved LLVM's inlining and left the
# module 155 bytes larger.
fenec-abi = { workspace = true, default-features = false }

# A page that needs no vector, text or sparse search, or no ordered index,
# loads a module built without it: `make wasm FEATURES=...`.
[features]
default = ["indexes"]
indexes = ["vector", "text", "sparse", "sorted"]
vector = ["fenec-core/vector"]
text = ["fenec-core/text"]
sparse = ["fenec-core/sparse"]
sorted = ["fenec-core/sorted"]

[package]
name = "fenec-server"
description = "The fenecdb server: a file or a directory of tenants over HTTP, replicated, archived and followed"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fenec-core = { workspace = true, features = ["std-fs", "indexes"] }
fenec-http = { workspace = true, features = ["studio"] }
# `--follow`: a PostgreSQL table mirrored into the file this server serves.
fenec-import.workspace = true

[dev-dependencies]
fenec-ql.workspace = true
# `tests/follow.rs` writes to the PostgreSQL it follows.
fenec-wire.workspace = true

[[bin]]
name = "fenec-server"
path = "src/main.rs"

[features]
# The HTTP endpoint's phase timings (`fenec-http`'s `timing`, `GET /_timing`).
timing = ["fenec-http/timing"]

[[test]]
name = "all"
path = "tests/all.rs"

# Apart: reads the process's own counts.
[[test]]
name = "metrics"
path = "tests/metrics.rs"

# Apart: reads the process's own counts.
[[test]]
name = "replica"
path = "tests/replica.rs"

# Apart: reads the process's own counts.
[[test]]
name = "statements"
path = "tests/statements.rs"

# Apart: reads the process's own counts.
[[test]]
name = "tenants"
path = "tests/tenants.rs"

[package]
name = "fenec-bench"
description = "Benchmark harness -- NOT a library dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# `make compare` runs the comparison; `beir` is asked for by name.
default-run = "fenec-bench"

[dependencies]
fenec-core = { path = "../fenec-core" }
fenec-ql = { path = "../fenec-ql" }
# For benchmarking only. SQLite is built from source so the version and the
# compile flags stay fixed.
rusqlite = { version = "0.40", features = ["bundled"] }
# For the PostgreSQL + pgvector comparison (only in this harness).
postgres = "0.19"

[[bin]]
name = "fenec-bench"
path = "src/main.rs"

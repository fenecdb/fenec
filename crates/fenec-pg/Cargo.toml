[package]
name = "fenec-pg"
description = "PostgreSQL plugin for fenecdb: a v3 wire protocol server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fenec-core = { workspace = true, features = ["std-fs", "indexes"] }
fenec-ql.workspace = true
fenec-http.workspace = true
fenec-catalog.workspace = true
fenec-wire.workspace = true
# `--follow`: a PostgreSQL table mirrored into the file this server serves.
fenec-import.workspace = true

[[bin]]
name = "fenec-pg"
path = "src/main.rs"

[package]
name = "fenec-core"
description = "fenecdb storage engine: zero-buffer-pool segments, native vectors, plugin registry"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# deliberately zero dependencies: keeps the WASM bundle small and auditable

[dev-dependencies]
# For writing queries in tests. Cargo allows a cycle through a dev
# dependency; it is not a product dependency and never enters the WASM output.
fenec-ql = { path = "../fenec-ql" }

[features]
default = ["std-fs", "indexes"]
# File support (native). The WASM build is made without this feature.
std-fs = []
# The indexes a page may go without, and what answers through them: the HNSW
# graph (`near`, `fuse`), the text index (`match`, and `rerank`, which reads
# the vectors and needs no graph), the sparse inverted index (`near` over
# `sparse<N>`) and the ordered index (`@sorted`, whose queries the scan
# answers the same without it). A file declaring one a build lacks opens all
# the same, and its documents read and write.
indexes = ["vector", "text", "sparse", "sorted"]
vector = []
text = []
sparse = []
sorted = []

[[test]]
name = "all"
path = "tests/all.rs"

# Apart: run on its own without the indexes: the second command of `make test`.
[[test]]
name = "features"
path = "tests/features.rs"

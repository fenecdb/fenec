[package]
name = "fenec-abi"
description = "What fenecdb's C ABIs answer with: the browser module's and the native library's, one code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[dependencies]
# Without the indexes, as fenec-ql takes the core: each binding names the
# ones it is built with, and asking for them here would put them back into
# a browser module made without them.
fenec-core = { workspace = true, default-features = false }
fenec-ql.workspace = true

# `lock` names a lock file after the file a link leads to, as the core's
# open resolves it (`fs::resolved`): files, so not the browser module's.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fenec-core = { workspace = true, default-features = false, features = ["std-fs"] }

[features]
default = ["sync"]
# A replica's sync with a server (`sync`): the native library's; the
# browser module is built without it.
sync = []

[dev-dependencies]
fenec-core = { workspace = true, features = ["full", "std-fs"] }
# Its tests read named statements; the module it is built into does not.
fenec-ql = { workspace = true, features = ["statements"] }

[[test]]
name = "all"
path = "tests/all.rs"

[[example]]
name = "sync_bench"
path = "examples/sync_bench.rs"

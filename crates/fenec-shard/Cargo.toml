[package]
name = "fenec-shard"
description = "Tenant router for fenecdb: one HTTP front for many fenec-pg --dir nodes"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fenec-core = { workspace = true, features = ["std-fs", "indexes"] }
fenec-ql.workspace = true
fenec-http.workspace = true

[[bin]]
name = "fenec-shard"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

# Apart: reads the process's own counts.
[[test]]
name = "metrics"
path = "tests/metrics.rs"

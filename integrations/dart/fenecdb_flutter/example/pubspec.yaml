name: fenecdb_flutter_example
description: A todo list kept in a fenecdb file, its list a live query.
publish_to: none
version: 0.1.9

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  fenecdb_flutter:
    path: ../
  path_provider: ^2.1.0

dependency_overrides:
  fenecdb:
    path: ../../fenecdb

flutter:
  uses-material-design: true

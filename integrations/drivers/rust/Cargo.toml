# tokio-postgres over fenec-pg's pg wire (integrations/drivers/run-tests.sh):
# it asks every column in binary and sends every parameter as the type
# `Describe` names -- a vector through pgvector-rust's types. Outside the
# workspace: the crates take no outside package, and these tests are what a
# driver does.
[package]
name = "fenecdb-drivers-rust"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
pgvector = { version = "0.4", features = ["postgres", "halfvec"] }

[workspace]

# The browser module is built with WebAssembly SIMD. The distance kernels in
# crates/fenec-core/src/vector.rs are written against it (`vector::simd`),
# because the module is optimised for size and at `opt-level = "z"` LLVM does
# not vectorise them on its own: a 20 000 x 384 HNSW build took 28.0 s without
# it and 9.95 s with it, for 0.9 KB of the module.
#
# Every engine the client targets has SIMD: Chrome 91, Firefox 89, Safari 16.4
# (March 2023). Without this flag the scalar kernels are compiled instead, so
# a build that drops it still works -- it is only slower.
#
# `--compress-relocations`: wasm-ld otherwise writes every function index a
# call names and every address the code takes as a five-byte LEB, room for
# relocations that nothing applies once the module is linked. Written short
# the module went 451 416 -> 414 465 bytes, brotli 139 453 -> 137 291, gzip
# 167 836 -> 163 678 -- what a binaryen round trip removed, without the tool
# -- and it runs faster in V8, which tiers a function up by its size in
# bytes: `near` 0.37 -> 0.32 ms, a page of vectors as JSON 27.6 -> 23.5 ms,
# a 10 000 x 128 build 1.78 -> 1.70 s (`make wasm-speed`). It refuses debug
# information, so a build that keeps the names strips that
# (`CARGO_PROFILE_WASM_STRIP=debuginfo`, as `make size-report` does).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "-C", "link-arg=--compress-relocations"]

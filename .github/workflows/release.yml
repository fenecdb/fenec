name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built against musl so the artifacts are static: the same
          # reason the Dockerfile does it, i.e. no libc to match on the host.
          - name: x86_64-linux
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
          - name: aarch64-linux
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          # One macOS runner covers both architectures: Apple's clang
          # cross-compiles to x86_64 from an arm64 host without extra tooling.
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # rust-toolchain.toml also asks for wasm32, which this job does not need
      # but which costs one small download; the channel pin is worth keeping.
      - name: Install the pinned toolchain
        run: |
          rustup show
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done

      - name: Install musl tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          set -eu
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            # `fenec` takes the cli profile (panic = abort): a single process
            # with nothing to recover from, and ~12% smaller without the
            # unwind tables. `fenec-server` stays on release, where a panicking
            # connection thread unwinds and drops only its own session.
            cargo build --profile cli --target "$t" -p fenec-cli
            cargo build --release   --target "$t" -p fenec-server

            stage="fenec-v${version}-${t}"
            mkdir -p "$stage"
            cp "target/$t/cli/fenec" "target/$t/release/fenec-server" "$stage/"
            cp LICENSE README.md CONTRIBUTING.md "$stage/"
            tar -czf "dist/${stage}.tar.gz" "$stage"
            rm -rf "$stage"
            echo "${stage}.tar.gz  $(wc -c < "dist/${stage}.tar.gz") bytes"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  wasm:
    name: wasm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install the pinned toolchain
        run: rustup show

      - name: Build
        run: |
          set -eu
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          make wasm
          mkdir -p dist "fenec-web-v${version}"
          # What a page actually needs: the module, with every index, the
          # bundle and the types, the collation data the module fetches
          # beside it, and a note on the files. fenec.js imports builder.js and
          # http.js; client.js is the two without the engine.
          cp web/fenec.js web/builder.js web/http.js web/client.js web/fenec.wasm web/fenec.d.ts web/client.d.ts LICENSE "fenec-web-v${version}/"
          cp web/README.md "fenec-web-v${version}/README.md"
          cp -r web/collate "fenec-web-v${version}/"
          tar -czf "dist/fenec-web-v${version}.tar.gz" "fenec-web-v${version}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wasm
          path: dist/*.tar.gz
          if-no-files-found: error

  # The XCFramework SwiftPM fetches by the URL and checksum Package.swift
  # names at this tag. It was built before the tag (swift-binary.yml), since
  # the checksum had to be in the tagged manifest: here it is found by that
  # run and held to the checksum, and the release attaches it. A release
  # whose manifest names no such zip stops here rather than ship a package
  # SwiftPM would refuse.
  apple:
    name: XCFramework (from swift-binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Find the zip Package.swift names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          release=$(sed -n 's/^let release = "\(.*\)"/\1/p' Package.swift)
          want=$(sed -n 's/^let checksum = "\(.*\)"/\1/p' Package.swift)
          if [ "$release" != "$version" ]; then
            echo "::error::Package.swift names release $release, not $version: run swift-binary.yml for $version and merge its pull request before tagging (RELEASING.md)"
            exit 1
          fi
          run=$(gh run list -R "${{ github.repository }}" --workflow swift-binary.yml --status success -L 100 \
            --json databaseId,displayTitle \
            -q "[.[] | select(.displayTitle == \"Swift binary for v$version\")][0].databaseId")
          if [ -z "$run" ]; then
            echo "::error::no successful swift-binary.yml run for v$version"
            exit 1
          fi
          mkdir -p dist
          gh run download "$run" -R "${{ github.repository }}" -n "xcframework-v$version" -D dist
          got=$(sha256sum dist/FenecFFI.xcframework.zip | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::run $run's zip is $got; Package.swift names $want"
            exit 1
          fi
          echo "FenecFFI.xcframework.zip from run $run, checksum $got"
          # The Flutter plugin's frameworks, built by the same run.
          test -f dist/FenecFFIDynamic.xcframework.zip || {
            echo "::error::run $run kept no FenecFFIDynamic.xcframework.zip"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: dist-apple
          path: |
            dist/FenecFFI.xcframework.zip
            dist/FenecFFI.xcframework.zip.checksum
            dist/FenecFFIDynamic.xcframework.zip
          if-no-files-found: error

  # The Android AAR: the Kotlin library with the native library for
  # arm64-v8a, armeabi-v7a and x86_64, built with the runner's NDK.
  android:
    name: Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install the pinned toolchain and the Android targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          integrations/kotlin/build-aar.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: dist/*.aar
          if-no-files-found: error

  # The .deb and .rpm, made from the musl tarballs the `binaries` jobs just
  # built (tools/linux-packages.sh, packaging/nfpm.yaml). The binaries are
  # static, so a package depends on nothing, and nfpm makes both formats from
  # one description without dpkg or rpmbuild. nfpm is the release binary
  # tools/install-nfpm.sh pins, held to its checksum. Each architecture is
  # packed on a runner of its own, and its packages are installed, run and
  # removed in a Debian and a Fedora container of that architecture before
  # they are kept: a package that does not install stops the release here,
  # not on a user's machine. They go on the release beside the tarballs and
  # are in its SHA256SUMS.
  #
  # The checkout is this workflow's own commit -- the tag's, when a tag was
  # pushed -- and not the tag a dispatch names: the tarballs are the
  # artifacts and the version is the tag's name, so what is needed from the
  # tree is the packaging files, which a tag from before them (a dispatch for
  # an older tag whose release is still a draft) does not have.
  linux-packages:
    name: .deb and .rpm (${{ matrix.arch }})
    needs: binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64, artifact: dist-x86_64-linux }
          - { os: ubuntu-24.04-arm, arch: arm64, artifact: dist-aarch64-linux }
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: tarballs

      - name: Install nfpm
        run: |
          tools/install-nfpm.sh "$RUNNER_TEMP/nfpm"
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      # The files' times are the commit's: the same commit packs the same bytes.
      - name: Build
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          tools/linux-packages.sh "${TAG#v}" tarballs dist ${{ matrix.arch }}

      - name: Install, run and remove them
        run: tools/linux-packages-check.sh "${TAG#v}" dist ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    env:
      # BuildKit is what the Dockerfile's --mount=type=cache needs.
      DOCKER_BUILDKIT: '1'
      IMAGE: ghcr.io/${{ github.repository_owner }}/fenec-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Log in to ghcr.io
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Each architecture is built on its own native runner and pushed under an
      # arch-suffixed tag; the manifest job below stitches them together. This
      # is the reason there is no QEMU step -- emulating a Rust build is many
      # times slower than a second runner.
      - name: Build and push
        run: |
          set -eu
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          # image.source is what makes GHCR attach the package to this
          # repository, and with it the repository's permissions.
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t "$IMAGE:$version-${{ matrix.arch }}" .
          docker push "$IMAGE:$version-${{ matrix.arch }}"

  manifest:
    name: image (manifest)
    needs: image
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fenec-server
    steps:
      - name: Log in to ghcr.io
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Join the per-architecture images
        run: |
          set -eu
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          docker buildx imagetools create \
            -t "$IMAGE:$version" -t "$IMAGE:latest" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"

  publish:
    name: publish the release
    needs: [binaries, wasm, apple, android, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.aar *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      # A Go module in a subdirectory is fetched by a tag naming its
      # directory: `go get github.com/fenecdb/fenecdb/integrations/go@vX.Y.Z`
      # looks for integrations/go/vX.Y.Z, and vX.Y.Z alone is none of its
      # versions. Pushed beside the release's own, at the same commit, once
      # the builds above have passed; a push with the workflow's token starts
      # no workflow, and the tag matches no `v*` anyway. One already there,
      # from a release run again, is left: a module's version, once fetched,
      # is fixed in the checksum database and must not move.
      - name: Tag the Go module
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gotag="integrations/go/$tag"
          if git ls-remote --exit-code --tags origin "refs/tags/$gotag" >/dev/null; then
            echo "$gotag is there already"
          else
            git tag "$gotag" HEAD
            git push origin "refs/tags/$gotag"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Drafted, not published: the notes get a read before the release
          # goes out. `gh release edit --draft=false` publishes it.
          #
          # Re-running a release has to work -- a tag gets moved, or a job is
          # retried after a runner failure -- and `gh release create` refuses
          # when one already exists, so an existing release is updated in
          # place instead: a draft's assets are replaced.
          #
          # A published release's are not. The tarballs and SHA256SUMS are
          # what the Homebrew formula, install.sh and the packages name by
          # checksum, and a rebuild is not byte for byte the first build: a
          # replaced tarball would fail every `brew install` and every
          # checksum already taken from the old SHA256SUMS. So a published
          # release only gets the files it has no asset of.
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = true ]; then
              gh release upload "$tag" dist/* --clobber
            else
              have=$(gh release view "$tag" --json assets -q '.assets[].name')
              for f in dist/*; do
                name=$(basename "$f")
                if printf '%s\n' "$have" | grep -qxF "$name"; then
                  echo "$name is on the published release already: left as it is"
                else
                  gh release upload "$tag" "$f"
                  echo "::warning::$name was missing from the published release $tag and was added; the release's SHA256SUMS is not rewritten and does not list it"
                fi
              done
            fi
          else
            gh release create "$tag" dist/* \
              --draft \
              --title "$tag" \
              --generate-notes
          fi

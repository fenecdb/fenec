name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup component add rustfmt

      - run: cargo fmt --all --check

      - name: AGENTS.md is CLAUDE.md under its own title
        run: python3 tools/agents_md.py --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml follows stable, so a new release can bring a new
      # lint; this job is where that shows, rather than in someone's editor.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustup component add clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-clippy-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-clippy-

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The browser build compiles code the native one does not: the SIMD
      # kernels, the graph builder without threads, fenec-core without
      # std-fs.
      - run: cargo clippy -p fenec-wasm -p fenec-abi -p fenec-core -p fenec-ql --target wasm32-unknown-unknown -- -D warnings

      # A module made without some of the indexes (`make wasm FEATURES=...`)
      # compiles what the full one does not: the stand-ins in off.rs, and
      # the engine with its paths through them dead. None of the four, each
      # alone, and fenec-core's tests and examples without them.
      - run: |
          for f in "" vector text sparse sorted; do
            cargo clippy -p fenec-wasm -p fenec-core --target wasm32-unknown-unknown --no-default-features ${f:+--features=$f} -- -D warnings
          done
      - run: cargo clippy -p fenec-core --no-default-features --features std-fs --all-targets -- -D warnings

      # The native library with the JNI functions the Kotlin binding calls,
      # which the workspace's run builds without.
      - run: cargo clippy -p fenec-ffi --features jni --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins stable and asks for wasm32-unknown-unknown;
      # `rustup show` is what installs both before the first cargo call.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # The browser bundle comes first: web/fenec.sync.test.js and the
      # end-to-end half of web/fenec.test.js skip themselves when
      # web/fenec.wasm is missing, so without this the JS side is a no-op.
      # The module without the indexes is what web/fenec.test.js hands the
      # full one's files to, and back, and holds its `near` to the full
      # one's `near ... exact`.
      - name: Build WASM
        run: make wasm wasm-lite

      # site/build.py holds every size the docs quote against the module just
      # built, and under CI refuses one that drifted. The site is built only
      # on main, so phase 8 grew the module 490 -> 497 KB through two pull
      # requests that passed and a deploy that failed after the merge. One
      # runner is enough: the module is the one the site workflow builds, to
      # the byte, and brotli comes from apt.
      # esbuild bundles the app the docs weigh the client entry by, pinned as
      # the site's deploy pins it. The same build writes the site's search
      # index through the module and fails when a known query does not find
      # its page first (site/search.test.mjs).
      - name: Check the sizes the docs quote, and the site's search
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y --no-install-recommends brotli
          npm install -g esbuild@0.28.2
          python3 site/build.py
          # The playground's live highlighter is written from build.py's rules
          # and must colour every statement as the docs do.
          python3 site/test_highlight.py

      # Rust first, then the JS tests -- `cargo test` is also what builds the
      # fenec-server binary that the sync tests run against.
      - name: Test
        run: make test

      # make test checks it too, but only where the module was built; here
      # it was, and a runner that skipped a scenario fails the job.
      - name: Both sync runners ran every scenario
        run: node integrations/sync-scenarios-check.mjs

  # What a pull request does to the browser module against the branch it goes
  # into, on the run's summary page: raw, gzip and brotli, the code by crate,
  # module and part of the standard library, the ten functions that moved
  # most -- and beside it the sizes of the build without the indexes, the
  # test build `make wasm-lite` makes, which no package ships. A pull
  # request is checked out as its merge, so the base is the merge's first
  # parent. It fails nothing -- a size the docs quote is held by
  # site/build.py in the test job.
  size:
    name: size (browser module)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install the pinned toolchain
        run: rustup show

      - name: Measure the module against the base
        env:
          BASE: ${{ github.base_ref }}
        run: |
          sudo apt-get install -y --no-install-recommends brotli
          python3 crates/fenec-wasm/size_report.py HEAD^1 "$BASE"

  integrations:
    name: integrations (python, react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-integrations-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-integrations-

      # LangChain's standard vector store suite and the tests LlamaIndex's
      # own integrations run, from a python:3.13 container, against a
      # fenec-server started on the runner.
      - name: Python stores
        run: make python-test

      # The docs' example for each language -- Python, JavaScript, Go, C#,
      # Java, PHP, Ruby and Rust -- over HTTP against a fenec-server on the
      # runner, each with its language's own HTTP client.
      - name: Languages over HTTP
        run: make languages-test

      # integrations/builder-golden.json is what the JS builder makes of its
      # chains, which the Python, Go and .NET builders are held to below.
      - name: Builder golden file
        run: node web/golden.mjs --check

      # The Go and .NET SDKs against a primary, a replica of it and a node
      # of tenants their tests start, with the runner's Go and .NET; each
      # runs its builder over every case of the golden file.
      - name: Go SDK
        run: make go-test

      - name: .NET SDK
        run: make dotnet-test

      # useLiveQuery against a stand-in and a real fenec-server and replica; the
      # sync layer loads the browser module.
      - name: React hook
        run: make wasm react-test

      # The LangChain.js store over a database in the page and over the
      # HTTP endpoint of a fenec-server started here.
      - name: LangChain.js store
        run: make langchain-test

      # Retrieval for the Vercel AI SDK, against the SDK's own mock models.
      - name: Vercel AI SDK retrieval
        run: make ai-sdk-test

      # web/fenec.d.ts held to web/fenec.js: every export and method the
      # module has declared, and a caller's code type-checked under --strict;
      # then every TypeScript example in the docs against the same types.
      - name: TypeScript declarations
        run: make types-check

      # A database kept in a Durable Object's storage, against a stand-in
      # holding to its limits, and storage that fails part way; then the
      # example Worker under `wrangler dev`, workerd running it, stopped and
      # started again over the same storage.
      - name: Durable Object storage
        run: make cloudflare-test

      # What PyPI, npm and NuGet would take, built as they build it,
      # installed and used. A published release publishes them
      # (packages.yml).
      - name: Packages
        run: |
          integrations/packages.sh
          integrations/dotnet/package.sh

  # examples/: the Notes app in each language that runs on the runner, on
  # this checkout's build -- npm packs of web/ and integrations/react, the
  # Python client by PYTHONPATH, a Go replace, a .NET project reference,
  # Cargo paths -- each its smoke against a fenec-server of its own or the
  # engine in process, the Vite apps built besides. Swift, Kotlin and
  # Flutter run in the mobile jobs, beside their bindings.
  examples:
    name: examples (Node, Python, Go, .NET, Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-examples-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-examples-

      - name: The Notes examples
        run: |
          make wasm
          examples/run-tests.sh node-server web-local react python go dotnet rust

  # examples/shop: the Next.js shop over a release fenec-server -- the
  # catalog seeded, the site built, its lint, its correctness, security and
  # SEO tests, and Lighthouse CI's budgets in the runner's Chrome. A job of
  # its own: a Next build and twelve Lighthouse runs would double the
  # examples job.
  shop:
    name: examples (shop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-shop-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-shop-

      - name: The shop
        run: |
          make wasm
          cargo build --release -p fenec-server
          SHOP_FENEC_SERVER="$PWD/target/release/fenec-server" SHOP_LIGHTHOUSE=1 \
            CHROME_PATH="$(command -v google-chrome)" examples/run-tests.sh shop

  # examples/ledger: the payments ledger over a release fenec-server tenant
  # node -- 16 clients making 20 000 operations in process and over HTTP and
  # every invariant after, the security tests, the change-stream sink, a
  # sealed backup restored, and a server killed with SIGKILL under the load. A job of its own, like the
  # shop's: a release server, and about two minutes of load.
  ledger:
    name: examples (ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-ledger-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-ledger-

      - name: The ledger
        run: |
          make wasm
          cargo build --release -p fenec-server -p fenec-cli
          LEDGER_FENEC_SERVER="$PWD/target/release/fenec-server" LEDGER_FENEC_CLI="$PWD/target/release/fenec" \
            examples/run-tests.sh ledger

  # examples/saas: Trellis, the team workspace, over release fenec-server
  # tenant nodes and fenec-shard -- its auth and token attack tests, the
  # role matrix against the router, scoped subscriptions and search, a
  # tenant moved and a node killed under load. A job of its own, like the
  # ledger's: release binaries, and a cluster a test file.
  saas:
    name: examples (saas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-saas-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-saas-

      - name: Trellis
        run: |
          make wasm
          cargo build --release -p fenec-server -p fenec-shard
          SAAS_FENEC_SERVER="$PWD/target/release/fenec-server" SAAS_FENEC_SHARD="$PWD/target/release/fenec-shard" \
            examples/run-tests.sh saas

  # examples/analytics: Kestrel, product analytics over a release
  # fenec-server tenant node -- 40 days of history folded by the rollup
  # worker, its correctness tests against brute force (rollups, funnel,
  # retention, bars, VWAP), its security and SEO tests, its latency budgets
  # and Lighthouse CI's in the runner's Chrome. A job of its own, like the
  # shop's and the ledger's.
  analytics:
    name: examples (analytics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-analytics-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-analytics-

      - name: Kestrel
        run: |
          make wasm
          cargo build --release -p fenec-server
          ANALYTICS_FENEC_SERVER="$PWD/target/release/fenec-server" ANALYTICS_LIGHTHOUSE=1 \
            CHROME_PATH="$(command -v google-chrome)" examples/run-tests.sh analytics

  build:
    name: build (release + cli profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-build-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-build-

      # `make small` is the smallest shell binary and the only build of the
      # CLI without its default features, import and backup. fenec-core
      # without std-fs is the browser build's, in the test and clippy jobs.
      - name: Build the CLI (cli profile, no default features)
        run: make small

      - name: Build the server (release)
        run: cargo build --release -p fenec-server

  # The native library an app links (crates/fenec-ffi) on Android and the
  # JVM, and its Kotlin, Dart and Flutter bindings: the Kotlin library's
  # JVM tests against the Linux build, the AAR with the library built by
  # the NDK for each ABI, the Dart package's tests, the Flutter plugin's,
  # and the plugin's example built as an Android app. The runner has the
  # Android SDK and NDK.
  mobile-android:
    name: mobile (Android, JVM, Dart, Flutter)
    runs-on: ubuntu-latest
    # About 10 minutes warm: a hang fails within the hour rather than at
    # the runner's six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain and the Android targets
        run: |
          rustup show
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-mobile-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu-latest-mobile-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Linux with Gradle: run-tests.sh builds the library and the server
      # the sync tests start here and runs JUnit on the runner, no
      # container.
      - name: Kotlin (JVM tests)
        timeout-minutes: 20
        run: make kotlin-test

      - name: Android AAR
        run: |
          set -eu
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          integrations/kotlin/build-aar.sh dist-mobile

      # The Notes example over a Gradle composite build of integrations/kotlin
      # (FENEC_LOCAL): the JVM CLI's smoke against the library built above,
      # then the Compose app built as an APK.
      - name: Notes (Kotlin, Compose)
        timeout-minutes: 20
        run: examples/kotlin-android/run-smoke.sh

      - name: The library's size on Android and Linux
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          integrations/ffi-sizes.sh x86_64-unknown-linux-gnu aarch64-linux-android armv7-linux-androideabi x86_64-linux-android \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Dart package under Flutter's own Dart -- its sync tests against
      # a server run-tests.sh builds -- then the plugin's test.
      - name: Dart and the Flutter plugin
        timeout-minutes: 20
        run: make dart-test

      - name: The Flutter plugin in an Android app
        run: |
          set -eu
          integrations/dart/fenecdb_flutter/prepare.sh
          cd integrations/dart/fenecdb_flutter/example
          flutter create --platforms=android --project-name fenecdb_flutter_example .
          rm -rf test
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep libfenec_ffi.so

      # The Notes example: its logic's smoke under flutter test, then the
      # app built as an APK, on this checkout's packages (pub overrides).
      - name: Notes (Flutter)
        timeout-minutes: 20
        run: examples/flutter/run-tests.sh apk

      - uses: actions/upload-artifact@v7
        with:
          name: fenecdb-android
          path: dist-mobile/*.aar
          if-no-files-found: error

      # The log names each failing test with its assertion and stack (the
      # Kotlin build's testLogging, dart test's GitHub reporter); the JUnit
      # reports add each test's output. Gradle's HTML report was all a run
      # left of "1 failed" when it was not uploaded.
      - name: Test reports of a failing run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android
          path: |
            integrations/kotlin/fenecdb/build/reports/tests/
            integrations/kotlin/fenecdb/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The same on Apple's platforms: every slice of the XCFramework, the Swift
  # package's tests on macOS and on an iOS simulator, the library's size
  # linked for each target, and the Flutter plugin's example built for the
  # simulator. The runner has Xcode.
  mobile-apple:
    name: mobile (Swift, iOS, XCFramework)
    runs-on: macos-latest
    # About 13 minutes warm. A hung `swift test` held this runner for six
    # hours; the steps that run tests are bounded on their own as well.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain and the Apple targets
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios x86_64-apple-darwin

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-latest-mobile-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-latest-mobile-

      - name: XCFramework (macOS, iOS, the simulator)
        run: integrations/swift/build-xcframework.sh --zip

      # FenecFFI.framework a slice, the shared library: what the Flutter
      # plugin's pods vendor and CocoaPods embeds.
      - name: Dynamic XCFramework (the Flutter plugin's)
        run: integrations/swift/build-xcframework.sh --dynamic --zip

      # Package.swift takes the XCFramework just built; the sync tests
      # start a fenec-server, kill it and start it again.
      - name: Swift (macOS)
        timeout-minutes: 20
        run: |
          cargo build -p fenec-server
          swift test

      # The same tests with Swift's cooperative pool cut to one thread: a
      # call that blocks a thread of it hangs there at once, where on this
      # three-core runner it hung now and then -- the run that held it for
      # six hours. The script samples every thread of a run that hangs.
      - name: Swift (macOS, one cooperative thread)
        timeout-minutes: 10
        run: integrations/swift/test-strict.sh

      - name: Swift (iOS simulator)
        timeout-minutes: 20
        run: integrations/swift/test-ios.sh

      # The Notes example on the package at the root (FENEC_LOCAL): the
      # SwiftUI app and the CLI built, the CLI's smoke run, and the views'
      # library built for the iOS simulator.
      - name: Notes (Swift)
        timeout-minutes: 20
        working-directory: examples/swift
        env:
          FENEC_LOCAL: '1'
        run: |
          swift build
          swift run notes-cli smoke
          xcodebuild -scheme NotesKit -destination 'generic/platform=iOS Simulator' build -quiet

      - name: The library's size on Apple's platforms
        run: |
          integrations/ffi-sizes.sh aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: The Flutter plugin in an iOS app
        run: |
          set -eu
          integrations/dart/fenecdb_flutter/prepare.sh
          cd integrations/dart/fenecdb_flutter/example
          flutter create --platforms=ios --project-name fenecdb_flutter_example .
          rm -rf test
          flutter build ios --simulator --debug --no-codesign

      - uses: actions/upload-artifact@v7
        with:
          name: fenecdb-xcframework
          path: |
            integrations/swift/build/FenecFFI.xcframework.zip
            integrations/swift/build/FenecFFI.xcframework.zip.checksum
            integrations/swift/build/FenecFFIDynamic.xcframework.zip
          if-no-files-found: error

      # `swift test` names a failing test and its issue in the log; the
      # simulator's run keeps its result bundle (test-ios.sh), which holds
      # each test's output and the crash logs.
      - name: Test results of a failing run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-apple
          path: integrations/swift/build/ios-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

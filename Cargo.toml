[workspace]
resolver = "2"
members = [
    "crates/fenec-core",
    "crates/fenec-ql",
    "crates/fenec-abi",
    "crates/fenec-wasm",
    "crates/fenec-ffi",
    "crates/fenec-server",
    "crates/fenec-wire",
    "crates/fenec-http",
    "crates/fenec-import",
    "crates/fenec-shard",
    "crates/fenec-cli",
    "crates/fenec-bench",
]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fenecdb/fenec"
readme = "README.md"
keywords = ["database", "vector", "embedded", "wasm", "http"]
categories = ["database", "database-implementations", "wasm"]

# The internal crates carry a version as well as a path: cargo refuses to
# publish a dependency that has only a path, and keeping them here means a
# release bumps one number instead of seven.
[workspace.dependencies]
# Without its files: fenec-ql and fenec-wasm take the core as it is, and a
# crate that opens files names `std-fs`. Left on here, the `default-features =
# false` those two write was ignored and the browser build had them too.
fenec-core = { version = "0.1.3", path = "crates/fenec-core", default-features = false }
fenec-ql = { version = "0.1.3", path = "crates/fenec-ql" }
fenec-abi = { version = "0.1.7", path = "crates/fenec-abi", default-features = false }
fenec-http = { version = "0.1.3", path = "crates/fenec-http" }
fenec-server = { version = "0.1.3", path = "crates/fenec-server" }
fenec-wire = { version = "0.1.8", path = "crates/fenec-wire" }
fenec-import = { version = "0.1.3", path = "crates/fenec-import" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# `cargo test` builds some 70 binaries, each linked with the whole engine:
# line tables are enough for a backtrace's lines, and the rest of the debug
# information was most of what the linker read and wrote.
[profile.test]
debug = "line-tables-only"

# Small binary for the `fenec` shell: abort instead of panic unwinding.
# The shell is a single process with no scenario for recovering from a panic;
# the unwind tables, meanwhile, take ~12% of the binary. `fenec-server` does *not*
# use this profile: there a panicking connection thread unwinds and only
# drops its own request, leaving the server up.
[profile.cli]
inherits = "release"
panic = "abort"

# The shell reaches fenec-http only for `fenec backup`, `archive` and
# `restore`, which wait on the network and the disk: built for size it is
# 16.3 KB less of the released binary (`make size-report BIN=fenec`). The
# importer stays fast -- built for size it took 32.6 KB off, and a
# 200 000-row SQLite import from 251 to 285 ms -- and so does the root
# crate: built for size it made the binary 129 KB larger.
[profile.cli.package.fenec-http]
opt-level = "z"

# The native library an app links (fenec-ffi): release speed, and panics
# that unwind, as the server's do -- each call catches one at the boundary
# and answers FENEC_PANIC, where `abort` would take the app down with it.
# Named rather than left to `release` so the choice is written where it is
# made, and so a change to `release` does not move it.
[profile.ffi]
inherits = "release"
panic = "unwind"

# On WASM, size comes first.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"

# For profiling: release speed plus symbols
[profile.profiling]
inherits = "release"
debug = true
strip = false

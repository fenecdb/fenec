# fenecdb with Prometheus and Grafana, both dashboards already loaded: the
# server's metrics (grafana/fenecdb.json, through Prometheus) and its data
# (grafana/fenecdb-data.json, through the Infinity plugin and POST /query):
#
#   FENEC_HTTP_TOKEN=secret FENEC_METRICS_TOKEN=scrape \
#   FENEC_JWT_SECRET=$(openssl rand -hex 32) \
#     docker compose -f monitoring/docker-compose.yml up -d
#   open http://127.0.0.1:3000/d/fenecdb
#   open http://127.0.0.1:3000/d/fenecdb-data
#
# fenec-server serves /_metrics on a listener of its own (--metrics), so the
# data port need not be on the compose network. That listener is on it
# alone and still takes a token: a non-loopback address wants one.
#
# `seed` writes thirty days of a site's events and a week of trades into the
# database the first time, and mints the token Grafana reads them with.
# `docker compose ... down -v` takes the data and the token away with the
# containers. FENEC_PORT, GRAFANA_PORT and PROMETHEUS_PORT move the ports
# published on loopback (`make grafana-check` runs beside a stack on the
# usual ones).

services:
  fenecdb:
    build: ..
    image: fenecdb
    command:
      - --http
      - 0.0.0.0:8080
      - --file
      - /data/data.fenec
      - --sync
      - "250"
      - --metrics
      - 0.0.0.0:9464
      - --admin-token
      - "${FENEC_METRICS_TOKEN:?set a scrape token, e.g. FENEC_METRICS_TOKEN=scrape}"
      # Statements that take 100 ms or longer go to the log with their text.
      - --slow-ms
      - "100"
      # JSON Web Tokens are held to these rules: Grafana's reads `events`
      # and `ticks` and writes nothing. The secret comes from a file, which
      # the seed reads to mint Grafana's token, rather than from
      # FENEC_JWT_SECRET, which every process in the container would see.
      - --jwt-secret-file
      - /run/secrets/fenec_jwt_secret
      - --policy
      - /etc/fenec/policy.txt
    environment:
      FENEC_HTTP_TOKEN: "${FENEC_HTTP_TOKEN:?set a token first, e.g. FENEC_HTTP_TOKEN=secret}"
    secrets:
      - fenec_jwt_secret
    ports:
      - "127.0.0.1:${FENEC_PORT:-8080}:8080"
    volumes:
      - fenecdata:/data
      - ./policy.txt:/etc/fenec/policy.txt:ro
    mem_limit: 1g
    restart: unless-stopped
    stop_grace_period: 30s

  # Runs once and exits: the data the data dashboard reads, made by
  # examples/analytics' traffic simulator, which Node runs with its types
  # stripped -- nothing to build or install.
  seed:
    image: node:24.21.0-alpine
    depends_on:
      - fenecdb
    command: ["node", "/monitoring/seed/seed.mjs"]
    environment:
      FENEC_URL: http://fenecdb:8080
      FENEC_HTTP_TOKEN: "${FENEC_HTTP_TOKEN:?set a token first}"
      FENEC_JWT_SECRET_FILE: /run/secrets/fenec_jwt_secret
      GRAFANA_TOKEN_FILE: /run/fenec/grafana.jwt
    secrets:
      - fenec_jwt_secret
    volumes:
      - ./seed:/monitoring/seed:ro
      - ../examples/analytics/src:/examples/analytics/src:ro
      - grafana-token:/run/fenec
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.14.0
    # Prometheus reads a token from a file, not from the environment.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf %s "$$FENEC_METRICS_TOKEN" > /prometheus/token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
    environment:
      FENEC_METRICS_TOKEN: "${FENEC_METRICS_TOKEN:?set a scrape token}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.2
    # The data source reads the token the seed mints, so it waits for it.
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fenecdb.json
      # The Infinity data source, installed before provisioning reads the
      # data source that names it: the asynchronous GF_PLUGINS_PREINSTALL
      # may still be downloading then.
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.1
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/fenecdb.json:/var/lib/grafana/dashboards/fenecdb.json:ro
      - ./grafana/fenecdb-data.json:/var/lib/grafana/dashboards/fenecdb-data.json:ro
      # The data source's token alone, not the secret that signs it.
      - grafana-token:/run/fenec:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  fenecdata:
  grafana-token:

# Signs the JWTs fenec-server takes: 32 bytes or more, e.g.
# FENEC_JWT_SECRET=$(openssl rand -hex 32). Only the server and the seed
# see it; Grafana gets the token the seed signs with it.
secrets:
  fenec_jwt_secret:
    environment: FENEC_JWT_SECRET
